networks:
  internal:
    driver: bridge

volumes:
  db_portfolio:

services:
  db-portfolio:
    image: postgres:18.1-alpine
    container_name: db_portfolio
    restart: unless-stopped
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: password
    ports:
      - 5476:5432
    volumes:
      - db_portfolio:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio -d portfolio"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
